    fill="#000000"
    text-anchor="middle">Sixty-four original paintings on laser-cut wood.</text>
  <text x="260.0" y="354"
    font-family="Georgia, serif"
    font-size="17"
    fill="#000000"
    text-anchor="middle">Each carries a hexagram from the I Ching,</text>
  <text x="260.0" y="378"
    font-family="Georgia, serif"
    font-size="17"
    fill="#000000"
    text-anchor="middle">a Gene Key, a gate from Human Design.</text>

