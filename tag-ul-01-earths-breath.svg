<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 50"
     width="100mm" height="50mm">

  <!--
    UNIVERSAL LANGUAGE TAG TEMPLATE — 100 × 50 mm
    ─────────────────────────────────────────────
    To adapt for another card, update:
      1. Series number in the header line
      2. Card name (title)
      3. Hex lines  — change yin (broken) vs yang (solid) per card
      4. Large numeral
      5. I Ching name — strip the parenthetical Chinese, e.g. "Preponderance of the Small"
      6. Gene Keys triple — Shadow · Gift · Siddhi

    Font sizes chosen to hold for all 64 cards:
      Title:        6.5 mm — max ~22 chars (longer titles need manual reduction)
      I Ching name: 4.5 mm — max ~26 chars after stripping Chinese transliteration
      Keywords:     3.8 mm — max ~44 chars (tested against longest: Oppression · Transmutation · Transfiguration)
      Labels:       2.8 mm — same as series line; bold + tracking creates hierarchy through weight, not size
      Numeral:      7.0 mm bold, centered in 16.5 mm left column — fits all 1- and 2-digit numbers

    Safe content zone: x 4.5 – 95.5,  y 4.5 – 45.5
    (Inner border at x/y 2.4; outer at 1.2)
  -->

  <rect x="0" y="0" width="100" height="50" fill="white"/>

  <!-- Double border -->
  <rect x="1.2" y="1.2" width="97.6" height="47.6" fill="none" stroke="black" stroke-width="0.5"/>
  <rect x="2.4" y="2.4" width="95.2" height="45.2" fill="none" stroke="black" stroke-width="0.15"/>

  <!-- ── TOP ZONE ── y 2.4 → 19 ──────────────────────────────── -->

  <!-- Series identifier -->
  <text x="50" y="9"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="2.8"
        font-weight="bold"
        letter-spacing="1.4"
        fill="black">UNIVERSAL LANGUAGE  ·  1</text>

  <!-- Card title: italic, centered, max ~22 chars at this size -->
  <text x="50" y="16.5"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="6.5"
        font-style="italic"
        fill="black">Earth's Breath</text>

  <!-- Zone divider -->
  <line x1="4.5" y1="19" x2="95.5" y2="19" stroke="black" stroke-width="0.35"/>

  <!-- ── BOTTOM LEFT — HEXAGRAM + NUMERAL ───────────────────────
       Column: x 4.5 → 21  (16.5 mm wide)
       Hex:    6 lines × 3 mm pitch, top at y=21, bottom at y=36
       Numeral baseline y=44 — shared with keywords baseline (right col)
       Gap hex bottom (y=36.75) → numeral cap top (~y=39.1) = 2.35 mm ✓ -->

  <!-- HEXAGRAM 1 — The Creative (Ch'ien): all six lines Yang (solid) -->
  <line x1="4.5" y1="21" x2="21" y2="21" stroke="black" stroke-width="1.5"/>
  <line x1="4.5" y1="24" x2="21" y2="24" stroke="black" stroke-width="1.5"/>
  <line x1="4.5" y1="27" x2="21" y2="27" stroke="black" stroke-width="1.5"/>
  <line x1="4.5" y1="30" x2="21" y2="30" stroke="black" stroke-width="1.5"/>
  <line x1="4.5" y1="33" x2="21" y2="33" stroke="black" stroke-width="1.5"/>
  <line x1="4.5" y1="36" x2="21" y2="36" stroke="black" stroke-width="1.5"/>

  <!-- Large numeral — centered in left column, baseline shared with keywords -->
  <text x="12.75" y="44"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="7"
        font-weight="bold"
        fill="black">1</text>

  <!-- ── BOTTOM RIGHT — I CHING + GENE KEYS ─────────────────────
       Column: x 26 → 95.5  (69.5 mm wide)
       All text right-aligned to x=95.5

       Vertical rhythm (right col):
         I CHING label   y=23   (2.8 mm bold, top ~y=21.0 — 2 mm below zone divider)
         I Ching name    y=30   (4.5 mm, top ~y=26.9 — 3.9 mm gap below label)
         Section rule    y=33.5 (3.5 mm gap below name baseline)
         GENE KEYS label y=38   (1.7 mm gap above label top ~y=35.8)
         Keywords        y=44   (3.8 mm, shared baseline with numeral "1") -->

  <text x="95.5" y="23"
        text-anchor="end"
        font-family="Arial, sans-serif"
        font-size="2.8"
        font-weight="bold"
        letter-spacing="1"
        fill="black">I CHING</text>

  <!-- I Ching name: strip parenthetical Chinese — max ~26 chars at 4.5 mm -->
  <text x="95.5" y="30"
        text-anchor="end"
        font-family="Georgia, serif"
        font-size="4.5"
        fill="black">The Creative</text>

  <!-- Hairline rule between blocks -->
  <line x1="26" y1="33.5" x2="95.5" y2="33.5" stroke="black" stroke-width="0.15"/>

  <text x="95.5" y="38"
        text-anchor="end"
        font-family="Arial, sans-serif"
        font-size="2.8"
        font-weight="bold"
        letter-spacing="1"
        fill="black">GENE KEYS</text>

  <!-- Shadow · Gift · Siddhi — max ~44 chars at 3.8 mm fits 69.5 mm column -->
  <text x="95.5" y="44"
        text-anchor="end"
        font-family="Georgia, serif"
        font-size="3.8"
        fill="black">Entropy · Freshness · Beauty</text>

</svg>
