name = "adrian-website-media"
main = "workers/media.js"
compatibility_date = "2024-09-23"
workers_dev = true

[cache]
enabled = true

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "adrian-website-media"

[[routes]]
pattern = "adrianrasmussen.com/media/*"
zone_name = "adrianrasmussen.com"

[[routes]]
pattern = "www.adrianrasmussen.com/media/*"
zone_name = "adrianrasmussen.com"
