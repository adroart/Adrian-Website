# Conductor workspace scripts — shared across every workspace on this repo.
# The Run / Setup tabs in Conductor read these. Docs: https://conductor.build/docs
"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Runs once when Conductor creates a new workspace (fresh git checkout).
setup = "npm install"

# Let several workspaces run their preview at once — each gets its own
# $CONDUCTOR_PORT instead of fighting over one fixed port.
run_mode = "concurrent"

# Default Run action.
# - Binds the port Conductor assigns this workspace ($CONDUCTOR_PORT), falling
#   back to 5555 (this project's normal port) when run outside Conductor.
# - vite.config.ts pins server.port = 5555 with strictPort: true, but the CLI
#   --port flag overrides that, so this is safe to run concurrently.
# - No live-secret refresh: .env.production only holds comments (Better Auth
#   secrets live in Cloudflare Pages env, not the repo) and .env.local only
#   holds optional newsletter/Tavily keys that aren't required to preview the
#   UI, so the preview boots fine without any secret-fetching step.
[scripts.run.web]
command = "npx vite --port ${CONDUCTOR_PORT:-5555}"
icon = "play"
default = true
