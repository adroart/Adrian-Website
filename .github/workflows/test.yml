# Typecheck and unit tests on every push and pull request.
#
# Added 2026-09-02. Until then this repository ran no tests in CI at all: its
# only workflow was the parked collector-letters job, so a green tick on a
# pull request meant the site had built and nothing more. That was a poor
# trade for the repository that now holds the collector registry, where an
# untested change reaches ownership records.
#
# The Playwright suite is deliberately not run here. It needs a built site and
# browsers; this lane guards the pure logic underneath (registry, lineage,
# recovery proofs, collector privacy, the atlas projection), which is where a
# silent break would do the most damage.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
