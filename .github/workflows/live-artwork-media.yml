name: Live artwork media

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Check every live artwork thumbnail
        run: node --import tsx scripts/check-live-artwork-media.ts
