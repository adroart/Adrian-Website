name = "adrian-website"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

[[r2_buckets]]
binding = "MUSIC_BUCKET"
bucket_name = "adrian-music"

# Optional: GitHub mirror for ledger durability. Leave unset to disable.
# Set on the Cloudflare Pages project (Settings > Environment variables).
# GITHUB_MIRROR_TOKEN  - fine-grained PAT with Contents read/write
# GITHUB_MIRROR_REPO   - "owner/repo" (e.g. "technicianofthesacred/adrian-atlas-mirror")
# GITHUB_MIRROR_PATH   - file path in repo (e.g. "atlas/public.json")
