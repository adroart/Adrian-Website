name = "adrian-website"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

[[r2_buckets]]
binding = "MUSIC_BUCKET"
bucket_name = "adrian-music"

# D1 database for user accounts, profiles, orders, cart, and collections.
#
# UNCOMMENT this block AFTER provisioning. Cloudflare Pages rejects deploys
# when the database_id is not a real id, so the binding stays commented out
# until the resource exists. Steps to enable:
#
#   1. wrangler d1 create adrian-website
#   2. Replace `paste-database-id-here` below with the id from step 1
#   3. Uncomment the four lines
#   4. wrangler d1 migrations apply adrian-website --remote
#
# Every Function that needs the DB already guards on `if (!env.DB)` and
# returns 503 db_not_configured at runtime, so the site keeps building
# and the non-account routes keep working while this is commented out.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "adrian-website"
# database_id = "paste-database-id-here"
# migrations_dir = "migrations"

# Optional: GitHub mirror for ledger durability. Leave unset to disable.
# Set on the Cloudflare Pages project (Settings > Environment variables).
# GITHUB_MIRROR_TOKEN  - fine-grained PAT with Contents read/write
# GITHUB_MIRROR_REPO   - "owner/repo" (e.g. "technicianofthesacred/adrian-atlas-mirror")
# GITHUB_MIRROR_PATH   - file path in repo (e.g. "atlas/public.json")
