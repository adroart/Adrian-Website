<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adrian Rasmussen | Resonant Artifacts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Lato:wght@300;400&family=Space+Mono:ital,wght@0,400;1,400&family=Merriweather:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <script>
      // 1. Critical Polyfill
      window.process = {
        env: {
          NODE_ENV: 'production',
          API_KEY: '' 
        }
      };

      // 2. Global Error Trap
      window.onerror = function(message, source, lineno, colno, error) {
        console.error("Global Error:", message, error);
        const root = document.getElementById('root');
        const loader = root ? root.querySelector('.initial-loader') : null;
        
        if (loader) {
            let errorText = typeof message === 'string' ? message : JSON.stringify(message);
            loader.innerHTML = `
                <div style="padding:40px; text-align:center; color:#7f1d1d; font-family:monospace; max-width:600px; background:#fff; border:1px solid #7f1d1d;">
                    <h2 style="font-size:16px; font-weight:bold; margin-bottom:10px;">CRITICAL FAILURE</h2>
                    <p style="margin-bottom:20px;">The studio crashed during initialization.</p>
                    <div style="background:#fef2f2; border:1px solid #ef4444; padding:15px; text-align:left; font-size:11px; margin-bottom:20px; overflow:auto; max-height: 200px;">
                        <strong>Message:</strong> ${errorText}<br/>
                        <strong>Source:</strong> ${source}:${lineno}
                    </div>
                    <button onclick="window.location.reload()" style="padding:10px 20px; background:#262321; color:#f5f4f0; border:none; cursor:pointer;">RETRY</button>
                </div>
            `;
        }
      };
      
      // Tailwind Config
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Cormorant Garamond"', 'serif'],
              sans: ['"Lato"', 'sans-serif'],
              mono: ['"Space Mono"', 'monospace'],
              display: ['"Merriweather"', 'serif'],
              title: ['"Cinzel"', 'serif'],
            },
            colors: {
              taupe: { DEFAULT: '#453d39', light: '#594e48' },
              cream: { DEFAULT: '#f2efe9', dark: '#e6e2d8' },
              'warm-gold': { DEFAULT: '#b0966b', hover: '#9e8459' },
              paper: { 50: '#f5f4f0', 100: '#ebe8e1', 200: '#e0dbcf', 300: '#cfc6b5' },
              wood: { 400: '#a89070', 500: '#8f7a5b', 600: '#736046', 700: '#524330', 800: '#3d3226', 900: '#262321' },
              stone: { 50: '#f7f6f4', 100: '#ebe9e6', 200: '#dcd9d4', 300: '#c2beb8', 400: '#a39e96', 500: '#878179', 600: '#6b665f', 700: '#524e49', 800: '#3d3a36', 900: '#2b2926', 950: '#23201e' },
              bronze: { 200: '#e6d9c3', 400: '#c4aa7c', 500: '#ab9266', 600: '#8a744e', 900: '#453825' },
            },
            animation: {
              'spin-slow': 'spin 20s linear infinite',
              'spin-reverse-slow': 'spinReverse 25s linear infinite',
              'draw': 'draw 2s ease-out forwards',
              'fade-in': 'fadeIn 0.8s ease-out forwards',
              'slide-up': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'marquee': 'marquee 25s linear infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'ripple': 'ripple 0.6s linear forwards',
            },
            keyframes: {
              marquee: { '0%': { transform: 'translateX(0%)' }, '100%': { transform: 'translateX(-100%)' } },
              spinReverse: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(-360deg)' } },
              draw: { '0%': { strokeDashoffset: '1000' }, '100%': { strokeDashoffset: '0' } },
              slideUp: { '0%': { transform: 'translateY(40px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              ripple: { '0%': { transform: 'scale(0)', opacity: '1' }, '100%': { transform: 'scale(4)', opacity: '0' } }
            }
          }
        }
      }
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0",
    "@google/genai": "https://esm.sh/@google/genai@0.1.1",
  }
}
</script>
</head>
  <body>
    <div id="root">
        <div class="initial-loader" style="height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; background-color: #f5f4f0; color: #262321; font-family: monospace; flex-direction: column; gap: 20px;">
            <div style="width: 40px; height: 40px; border: 2px solid #e0dbcf; border-top-color: #b0966b; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <span style="font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;">Initializing Studio...</span>
            <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>
    <div class="noise-overlay"></div>
    <script type="module" src="./index.tsx"></script>
    
    <!-- Emergency Failsafe: If app hangs for 8 seconds, assume connection or build error -->
    <script>
        setTimeout(function() {
            const root = document.getElementById('root');
            const loader = root ? root.querySelector('.initial-loader') : null;
            if (loader) {
                console.error("Emergency Failsafe: App failed to mount in 8 seconds.");
                loader.innerHTML = `
                    <div style="text-align:center; padding:20px; color:#7f1d1d; font-family:monospace;">
                        <h2 style="font-size:18px; margin-bottom:10px;">Connection Timeout</h2>
                        <p style="margin-bottom:20px;">The studio failed to materialize.</p>
                        <button onclick="window.location.reload()" style="padding:10px 20px; background:#262321; color:#f5f4f0; border:none; cursor:pointer;">RETRY CONNECTION</button>
                    </div>
                `;
            }
        }, 8000);
    </script>
  </body>
</html>
