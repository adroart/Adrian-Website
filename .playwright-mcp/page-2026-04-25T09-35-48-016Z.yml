          - heading "Universal Language" [level=1] [ref=e37]
          - paragraph [ref=e38]: Sixty-four works. Each connected to a hexagram from the I Ching and a corresponding Gene Key. A complete symbolic language encoded in layered wood.
        - generic [ref=e40]:
          - paragraph [ref=e41]: There is a language that all of us know. Elemental. Genetic. Interstellar. Patterns that navigate the experience of life through the passage of time. It existed before the I Ching, Gene Keys, or astrology gave it a name. Felt through the diverse experiences of being human. Perceived through a 64-fold cycle of change. These creations are my way of cultivating a relationship to that cycle. Pay close attention to which ones call out to you. When one speaks, there is a reason waiting in the oracle.
          - link "Read the full story" [ref=e42] [cursor=pointer]:
            - /url: /writings/the-universal-language
