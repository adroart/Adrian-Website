            - generic [ref=e163]:
              - heading "How long does a commission take?" [level=4] [ref=e164]
              - paragraph [ref=e165]: Personal pieces typically take 4 to 8 weeks from our first conversation to completion. Spatial commissions and installations vary widely depending on scope, anywhere from 2 months to a year. We'll establish a timeline together once the vision is clear.
            - generic [ref=e167]:
              - heading "Where do pieces ship from?" [level=4] [ref=e168]
              - paragraph [ref=e169]: Most pieces are created in my studio in Bali and ship internationally from there. Ready-to-ship items typically arrive within 2 to 3 weeks. Commissioned work ships upon completion. I handle packaging personally to ensure safe arrival.
            - generic [ref=e171]:
              - heading "What sizes are available?" [level=4] [ref=e172]
              - paragraph [ref=e173]: I work across all scales, from palm-sized talismans and jewelry to room-filling installations. For commissions, size is part of the conversation. For ready-to-ship pieces, dimensions are listed on each piece's page.
