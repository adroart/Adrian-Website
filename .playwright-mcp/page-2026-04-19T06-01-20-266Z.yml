              - paragraph [ref=e76]: This is the energy of the open field. Not emptiness as absence, but emptiness as a condition, the quality of ground that has cleared itself so completely that what moves through it can move without obstruction. It does not push. It does not initiate. It holds. Everything that tries to lead here goes astray, and everything that follows finds its way.
              - paragraph [ref=e77]: There is a compass at the center of this energy, not the needle-and-dial kind that tells you where north is, but the kind that lives in the body and simply knows. It is not loud. It becomes audible only when the noise of agenda quiets down. When the drive to plan and direct and impose loosens its grip, something older surfaces, a felt sense of which way to move that does not need explanation. The mare does not consult a map. She finds her way.
