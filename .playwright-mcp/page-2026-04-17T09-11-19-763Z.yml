              - paragraph [ref=e110]: Mountain stands above, Water moves below. The upper trigram holds still, sets a limit, defines the frontier. The lower trigram flows and ventures, seeking its path through whatever terrain it finds. Together they describe the moment when something young and unformed meets something solid and patient. The spring does not know where it is going. The mountain does not explain. What emerges from this pairing is the dynamic between genuine teaching and genuine learning.
            - generic [ref=e111]:
              - button "The reading the oracle's reading for this configuration" [expanded] [ref=e112]:
                - generic [ref=e113]:
