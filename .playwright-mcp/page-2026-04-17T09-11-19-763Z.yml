              - generic [ref=e118]:
                - paragraph [ref=e119]: "This hexagram is called Youthful Folly. The situation is one of inexperience meeting wisdom, and the oracle is specific about the terms: it is not the teacher who seeks the student. The student seeks the teacher. When someone comes with a sincere question, once, the oracle answers. When someone asks again and again out of impatience or testing, the oracle goes silent. Not as punishment, but because real understanding cannot be forced."
                - paragraph [ref=e120]: "The image is a spring welling up at the foot of a mountain. The spring does not plan its course. It simply emerges and finds its way. This is what genuine learning looks like from the inside: not acquisition of facts but the slow welling up of something that was always there, finding its way through the stone. The mountain does not instruct the spring. It simply exists in its completeness, and the spring moves in response."
                - paragraph [ref=e121]: What this Key points to is the danger of premature certainty. The folly here is not stupidity. It is the specific folly of needing an answer before the question has finished forming. When the mind insists on resolution, it grasps the nearest available explanation and stops there. The veil of knowledge is not ignorance. It is the false security of a half-formed understanding that has been mistaken for the whole.
                - paragraph [ref=e122]: The oracle counsels modesty. Acknowledge what you do not know. Ask once, with sincerity, and then wait. The spring that pushes through stone does so by persisting in its nature, not by forcing. Character is built by thoroughness in small things, not by racing toward conclusions.
            - button "The classical text Wilhelm translation Youthful Folly has success." [ref=e124]:
