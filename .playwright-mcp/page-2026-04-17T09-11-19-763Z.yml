          - generic [ref=e233]:
            - generic [ref=e234]:
              - paragraph [ref=e235]: Tarot · Ring of Union
              - paragraph [ref=e236]: "Key 4 holds the face of inexperience in The Lovers. The Ring of Union carries four expressions of what it means for things to come together: the folly that precedes understanding, the guidance of virtue, the full commitment of the leap, and the transparency that makes intimacy possible. Key 4 holds the beginning of that arc, the moment before the choice is made, when the young mind is still covered by its own veils and learning has not yet taken root."
            - generic [ref=e237]:
              - paragraph [ref=e238]: The Lovers card is about a choice, but not the choice between two people or two paths. It is the deeper choice between two ways of knowing. One way grasps for certainty because uncertainty feels like danger. The other way is willing to stand in the question and let understanding arrive on its own terms.
              - paragraph [ref=e239]: The sword of discrimination cuts cleanly. Not cruelly, but without sentiment. It separates what you actually know from what you think you know, what is genuine from what is borrowed. The blade does not punish the inexperienced mind for being young. It simply makes the distinction visible.
              - paragraph [ref=e240]: Gemini governs this Arcana, the sign of two. The twin nature here is not good and evil or high and low. It is the gap between the question and the answer, between the student and the teacher, between the spring and the sea. Both poles are necessary. Neither can be collapsed into the other without something being lost.
              - paragraph [ref=e241]: The Key called Veils of Knowledge sits at this threshold. The veil is not the enemy. It is part of the process. The spring cannot skip the stone. It finds its way through by persisting in its nature, not by force.
          - generic [ref=e242]:
