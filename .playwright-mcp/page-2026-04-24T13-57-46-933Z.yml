            - generic [ref=e54]: Technician of the Sacred
            - heading "Adrian Rasmussen" [level=1] [ref=e57]:
              - text: Adrian
              - text: Rasmussen
            - generic [ref=e58]:
              - paragraph [ref=e60]: I create art and spaces of presence and connection. Multidimensional wooden sculptures with original paintings, light, and crystals. Jewelry. Oracle cards. Tea houses. Stages. Immersive installations you can walk into.
              - paragraph [ref=e62]: Some pieces are intimate enough to hold. Others transform entire environments. They've found their way into homes and spaces across dozens of countries. I work globally but spend most of my time between Bali and California.
              - paragraph [ref=e64]: The art is not the point. The connection between people is the point. The art holds a space which all of us rest inside. It is there as a confirmation, as a feeling, as a recognition.
          - generic [ref=e68]: "&"
          - generic [ref=e70]:
            - generic [ref=e72]:
              - generic [ref=e74]: The Root
              - generic [ref=e75]:
                - paragraph [ref=e76]: In my earliest years of school, I sat with the founder of Mount Madonna who had taken a vow of silence. He was from India but had decided to bring his wisdom to the West. People still flew from India to see him.
                - paragraph [ref=e77]: I had the opportunity to ask questions. He would respond on a chalkboard. But the feeling of sitting next to him was enough. The feeling of being seen. The feeling of presence. Truth that comes through direct connection to the Divine was the only question that mattered. And there was no answer. Except to sit and enjoy the Divinity.
                - paragraph [ref=e78]: Those years taught me the value of just being. Centered in yourself. Unconditionally being there with someone.
                - paragraph [ref=e79]: This is what inspires me to create and what I wish for people to feel in the presence of my creations.
            - img "Adrian Rasmussen portrait" [ref=e83]
          - generic [ref=e86]: ·
          - generic [ref=e90]:
            - generic [ref=e93]: The Path
            - generic [ref=e94]:
              - paragraph [ref=e97]: I've been creating since before I can remember. Graffiti culture shaped my eye. I painted thousands of one-of-a-kind hats, moved to canvas, and followed the work wherever it led. Then I discovered laser cutting and everything started to come together. Painting, digital design, airbrush, lapidary, jewelry, 3D printing. Many skills becoming one expression.
              - paragraph [ref=e100]: My tea journey came early. My father introduced it when I was young, and it never left. In 2009, I began exploring Asia. China, Japan, Thailand, Taiwan, Bali. Learning from guides. Qigong, Tai Chi, meditation, tea ceremony. The tea and the art have always effortlessly intertwined in creating spaces to experience communion.
              - paragraph [ref=e103]: Along the way, I discovered new tools. LEDs, airbrushing, projection mapping. I set up several studios built between Santa Cruz and Bali. The forms keep evolving. The intention stays the same. Art is the journey, bringing the formless into form in communion with something bigger than any one.
              - paragraph [ref=e106]: Wherever I go, the same thing happens. Creatives gather. Spaces get built. People start creating together. That's been true since 2002 and it's true now.
            - link "See the work" [ref=e109] [cursor=pointer]:
              - /url: /creations
          - generic [ref=e112]: §
          - generic [ref=e114]:
            - generic [ref=e117]: Connection
            - generic [ref=e118]:
              - generic [ref=e119]:
                - generic [ref=e120]:
                  - paragraph [ref=e121]: Bringing people together in cocreation has always inspired me.
                  - paragraph [ref=e122]: In Santa Cruz, I co-founded the Hide Gallery, which won Best Art Gallery. I helped launch First Friday, which grew from a handful of galleries into something the whole city came out for. I worked with the city and ArtSpace to bring the Tannery Lofts into being, housing for artists. Ten Burning Man festivals. The 150-foot stage for Arise. Ceremonies, parties, shows.
                  - paragraph [ref=e123]: Now I design tea houses and spaces where people can gather. The art, the space, the ceremony. All in service of what happens between people when presence is held. The tea and the art have always been intertwined. We sit in these spaces and connect to the elements, the room, the sounds, the sensations, the connection with all that is around us.
                - link "Begin a conversation" [ref=e125] [cursor=pointer]:
                  - /url: /inquire
              - img "Gathering and connection" [ref=e129]
          - generic [ref=e132]:
            - generic [ref=e134]: The Team
            - generic [ref=e135]:
              - paragraph [ref=e136]: I don't work alone. Many have walked this path with me. Learning, discovering, creating. We work hand in hand to bring these arts into form and share them with the planet.
              - paragraph [ref=e137]: A family from different origins. One mother. Earth.
          - img "Immersive installation space" [ref=e139]
          - generic [ref=e141]:
            - img "Adrian Rasmussen in the creation process" [ref=e145]
            - generic [ref=e146]:
              - generic [ref=e148]: Creation as Practice
              - generic [ref=e149]:
                - paragraph [ref=e150]: Creating is how I grow. My inner journey. A celebration of creation itself.
                - paragraph [ref=e151]: Through the process of creation I find deeper alignment with what is true to me. The more I create, the more authentic I become. And by expressing what is true for me, perhaps others feel permission to do the same.
                - paragraph [ref=e152]: When my mind leaves during creation, something else arrives. A current. I let go as much as I can and trust in my skills to bring forth what wants to come through.
          - paragraph [ref=e156]:
