          - generic [ref=e47]:
            - paragraph [ref=e48]: I have always written. Poetry that lives in notebooks, in margins, in the quiet after ceremony. Words that were never meant to be seen by many, just felt by me as a way of moving something through.
            - paragraph [ref=e49]: Recently, I began exploring what happens when those words are given a body. Not performed, not read aloud, but translated. Given melody, breath, texture, and time.
            - blockquote [ref=e50]: Poetry has always been music that forgot its notes. This is the remembering.
            - paragraph [ref=e51]: Using AI as a compositional collaborator, I feed the poem and something emerges. Not always what I expected. Sometimes more than I could have made alone. The AI does not understand the words the way I do. But it responds to their rhythm, their weight, their space.
            - generic [ref=e53]: ···
            - paragraph [ref=e54]: What I find is that the music reveals something the poem was already holding. A tone beneath the tone. A feeling that language points toward but cannot fully carry.
            - paragraph [ref=e55]: These are not produced tracks. They are experiments. First attempts at a language that is still forming. I share them here as they are, because that is the only honest thing to do.
            - paragraph [ref=e56]: If you listen, let the words land first. Then let the music do what words cannot.
